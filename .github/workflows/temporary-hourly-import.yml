name: Hourly catalogue expansion

on:
  schedule:
    - cron: '17 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch while catalogue work remains
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function readJson(path) {
              const { data: meta } = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: 'main'
              });

              if (Array.isArray(meta)) {
                throw new Error(`${path} is not a file`);
              }

              let content = meta.content;
              if (!content) {
                const { data: blob } = await github.rest.git.getBlob({
                  owner,
                  repo,
                  file_sha: meta.sha
                });
                content = blob.content;
              }

              return JSON.parse(Buffer.from(content, 'base64').toString('utf8'));
            }

            const state = await readJson('data/ingestion-state.json');
            const now = Date.now() / 1000;
            let pending = 0;

            for (const record of Object.values(state.titles || {})) {
              const status = record.status;

              if (status === 'pending') {
                pending++;
              } else if (status === 'failed') {
                const retryAt = Number(record.next_retry_at || 0);
                if (!retryAt || retryAt <= now) {
                  pending++;
                }
              }
            }

            let discoveryReport = {};
            try {
              discoveryReport = await readJson('data/discovery-report.json');
            } catch (error) {
              core.info(`Could not read discovery report: ${error.message}`);
            }

            const queueLength = Number(discoveryReport?.cursor?.queue_length || 0);

            if (pending === 0 && queueLength === 0) {
              await core.summary
                .addHeading('Catalogue is full')
                .addRaw('No pending or retryable titles remain and the discovery queue is empty; no import was dispatched.')
                .write();
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'update-data.yml',
              ref: 'main',
              inputs: {
                publish: 'true',
                batch: '1000',
                fetches: '10',
                thumbnail_size: 'large',
                reset_cursor: 'false'
              }
            });

            await core.summary
              .addHeading('Hourly import requested')
              .addRaw(`Pending or retryable titles: ${pending}; discovery queue: ${queueLength}. Batch: 1,000; publish: true; discovery fetches: 10; reset cursor: false.`)
              .write();
