name: Hourly catalogue expansion

on:
  schedule:
    - cron: '17 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request hourly catalogue expansion
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'update-data.yml',
              ref: 'main',
              inputs: {
                publish: 'true',
                batch: '1000',
                fetches: '10',
                thumbnail_size: 'large',
                reset_cursor: 'false'
              }
            });

            await core.summary
              .addHeading('Hourly catalogue expansion requested')
              .addRaw('The catalogue workflow will import up to 1,000 titles if pending or discoverable work remains.')
              .write();
