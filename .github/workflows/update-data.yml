name: Update library data

on:
  schedule:
    # Twice daily, chosen to keep availability reasonably fresh without
    # making unnecessary requests.
    - cron: "0 5 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import library data
        run: |
          python scripts/import_library.py \
            --max-results 40 \
            --delay 2.0

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json data/shelves.json data/import-report.json data/raw/search || true
          git diff --staged --quiet || git commit -m "Refresh library data"
          git push
