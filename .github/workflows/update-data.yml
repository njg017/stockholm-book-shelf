name: Update library data
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Commit generated books and shelves to main for the website
        type: boolean
        default: false
      batch:
        description: Number of new titles to import per run
        default: '100'
permissions:
  contents: write
concurrency:
  group: library-data-update
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Test title parser offline
        run: python scripts/test_title_metadata.py
      - name: Discover additional catalogue titles
        run: python scripts/discover_catalogue.py --pages-per-query 2 --rows 50 --delay 2
      - name: Import next catalogue batch
        run: python scripts/import_catalogue.py --batch ${{ inputs.batch || 100 }} --delay 2
      - name: Publish generated catalogue JSON
        if: ${{ success() && (github.event_name == 'schedule' || inputs.publish == true) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json data/shelves.json data/import-report.json data/catalogue-index.json data/availability.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh and expand catalogue data"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Upload data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphql-import
          path: |
            data/books.json
            data/shelves.json
            data/import-report.json
            data/catalogue-index.json
            data/availability.json
            data/raw/graphql/
            data/raw/title-html/
          retention-days: 14
