name: Expand catalogue metadata

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Commit generated books and shelves to main for the website
        type: boolean
        default: false
      batch:
        description: Number of new titles to import per run
        default: '100'
      fetches:
        description: Number of catalogue API requests for discovery per run
        default: '10'
      thumbnail_size:
        description: Cover thumbnail size (small, medium, large)
        type: choice
        options:
          - small
          - medium
          - large
        default: large
      reset_cursor:
        description: Reset the discovery cursor before running
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: library-data-update
  cancel-in-progress: false

jobs:
  expand-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Test title parser offline
        run: python scripts/test_title_metadata.py

      - name: Check whether catalogue work remains
        id: gate
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          state_path = Path('data/ingestion-state.json')
          state = {'titles': {}}
          if state_path.exists():
              state = json.loads(state_path.read_text(encoding='utf-8'))

          now = time.time()
          pending = 0

          for record in (state.get('titles') or {}).values():
              status = record.get('status')
              if status == 'pending':
                  pending += 1
              elif status == 'failed':
                  retry_at = float(record.get('next_retry_at') or 0)
                  if not retry_at or retry_at <= now:
                      pending += 1

          queue = 0
          report_path = Path('data/discovery-report.json')
          if report_path.exists():
              report = json.loads(report_path.read_text(encoding='utf-8'))
              queue = int(report.get('cursor', {}).get('queue_length') or 0)

          print(f'Pending or retryable titles: {pending}')
          print(f'Discovery queue length: {queue}')

          if pending == 0 and queue == 0:
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write('skip=true\n')
          PY
        env:
          GITHUB_OUTPUT: ${{ github.env }}

      - name: Discover additional catalogue titles
        if: steps.gate.outputs.skip != 'true'
        run: |
          ARGS=""
          if [ "${{ inputs.reset_cursor }}" = "true" ]; then
            ARGS="--reset-cursor"
          fi
          python scripts/discover_catalogue.py --page-size 500 --max-fetches "${{ inputs.fetches || 10 }}" --delay 2 $ARGS

      - name: Import next catalogue batch
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/import_catalogue.py --batch "${{ inputs.batch || 100 }}" --delay 1 --openlibrary-workers 6 --thumbnail-size "${{ inputs.thumbnail_size || 'large' }}"

      - name: Publish generated catalogue JSON
        if: ${{ success() && steps.gate.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.publish == true) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json data/shelves.json data/import-report.json data/catalogue-index.json data/availability.json data/discovery-report.json data/coverage-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Expand catalogue metadata"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Summarize run
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = {}
          for name in ('import-report.json', 'discovery-report.json'):
              path = Path('data') / name
              if path.exists():
                  report.update(json.loads(path.read_text()))
          print('### Catalogue expansion')
          print(f"- Imported: {report.get('imported_count', 0)}")
          print(f"- Records seen: {report.get('records_seen', 0)}")
          print(f"- Queued for import: {report.get('titles_queued_for_import', 0)}")
          print(f"- API fetches: {report.get('fetches', 0)}")
          print(f"- Cursor queue: {report.get('cursor', {}).get('queue_length', 0)}")
          print(f"- Errors: {len(report.get('errors', []))}")
          PY

      - name: Upload data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-metadata
          path: |
            data/books.json
            data/shelves.json
            data/import-report.json
            data/discovery-report.json
            data/catalogue-index.json
            data/availability.json
            data/raw/graphql/
            data/raw/title-html/
          retention-days: 14
