name: Expand catalogue metadata
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Commit generated books and shelves to main for the website
        type: boolean
        default: false
      batch:
        description: Number of new titles to import per run
        default: '300'
permissions:
  contents: write
concurrency:
  group: library-data-update
  cancel-in-progress: false
jobs:
  expand-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Test title parser offline
        run: python scripts/test_title_metadata.py
      - name: Discover additional catalogue titles
        run: python scripts/discover_catalogue.py --max-pages 10 --page-size 100 --delay 2
      - name: Import next catalogue batch
        run: python scripts/import_catalogue.py --batch ${{ inputs.batch || 300 }} --delay 2
      - name: Publish generated catalogue JSON
        if: ${{ success() && (github.event_name == 'schedule' || inputs.publish == true) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json data/shelves.json data/import-report.json data/catalogue-index.json data/availability.json data/discovery-report.json data/coverage-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Expand catalogue metadata"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Summarize run
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = {}
          for name in ('import-report.json', 'discovery-report.json'):
              path = Path('data') / name
              if path.exists(): report.update(json.loads(path.read_text()))
          print('### Catalogue expansion')
          print(f"- Imported: {report.get('imported_count', 0)}")
          print(f"- Records seen: {report.get('records_seen', 0)}")
          print(f"- Queued for import: {report.get('titles_queued_for_import', 0)}")
          print(f"- Pages fetched: {report.get('pages_fetched', 0)}")
          print(f"- Catalogue works: {report.get('total_catalogue_works', 0)}")
          print(f"- Duplicates merged: {report.get('duplicate_records_merged', 0)}")
          print(f"- Errors: {len(report.get('errors', []))}")
          PY
      - name: Upload data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-metadata
          path: |
            data/books.json
            data/shelves.json
            data/import-report.json
            data/discovery-report.json
            data/catalogue-index.json
            data/availability.json
            data/raw/graphql/
            data/raw/title-html/
          retention-days: 14
