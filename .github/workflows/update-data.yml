name: Update library data
on:
  workflow_dispatch:
    inputs:
      author:
        description: Author to import
        required: true
        default: Gabrielle Zevin
permissions:
  contents: read
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Import GraphQL search records
        env:
          AUTHOR: ${{ inputs.author }}
        run: python scripts/import_library.py --author "$AUTHOR" --rows 3 --delay 2
      - name: Upload data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphql-import
          path: |
            data/books.json
            data/shelves.json
            data/import-report.json
            data/raw/graphql/
          retention-days: 14
