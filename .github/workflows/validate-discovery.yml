name: Validate catalogue discovery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalogue-discovery-validation
  cancel-in-progress: false
jobs:
  validate-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run offline parser and pagination tests
        run: python scripts/test_discovery.py
      - name: Run one-fetch live discovery dry run
        run: python scripts/discover_catalogue.py --max-fetches 1 --page-size 3 --delay 2 --dry-run
      - name: Show discovery report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/discovery-report.json')
          print(json.dumps(json.loads(path.read_text()), ensure_ascii=False, indent=2))
          PY
      - name: Upload discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-validation
          path: |
            data/discovery-report.json
            data/raw/graphql/
          retention-days: 14
