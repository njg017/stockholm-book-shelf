name: Diagnose catalogue filters
on:
  workflow_dispatch:
    inputs:
      delay:
        description: Delay between API requests in seconds
        default: '2'
permissions:
  contents: write
concurrency:
  group: diagnose-filters
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Test language-filter page sizes
        run: python scripts/diagnose_filters.py --delay "${{ inputs.delay || 2 }}"
      - name: Commit filter diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/filters.json
          if ! git diff --cached --quiet; then
            git commit -m "Record filter diagnostic results"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-diagnostics
          path: diagnostics/
          retention-days: 14
